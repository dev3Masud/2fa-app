<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Shield & Lock Symbol -->
  <g filter="url(#glow)">
    <!-- Security Shield -->
    <path
      d="M32 50S46 41 46 29.5V16L32 11L18 16V29.5C18 41 32 50 32 50Z"
      fill="none"
      stroke="url(#shieldGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Lock Keyhole -->
    <circle cx="32" cy="26" r="3.5" fill="#ffffff" />
    <polygon points="30.5,28.5 33.5,28.5 34.5,36 29.5,36" fill="#ffffff" />
  </g>
</svg>
